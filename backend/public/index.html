<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ship-a-ton AI Assistant</title>
</head>

<body>

  <h1>Ship-a-ton AI Financial Assistant</h1>

  <div id="chat">
    <p>
      <strong>AI:</strong>
      Hi! Ask me anything about your spending or budget.
    </p>
  </div>

  <form id="chatForm">

    <input
      id="messageInput"
      type="text"
      placeholder="Ask about your finances..."
      required
    >

    <button type="submit">
      Send
    </button>

  </form>
<script>
  const chatForm = document.getElementById("chatForm");
  const messageInput = document.getElementById("messageInput");
  const chat = document.getElementById("chat");

  chatForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const message = messageInput.value.trim();

    if (!message) {
      return;
    }

    const userMessage = document.createElement("p");
    userMessage.textContent = "You: " + message;
    chat.appendChild(userMessage);

    messageInput.value = "";

    const loadingMessage = document.createElement("p");
    loadingMessage.textContent = "AI: Thinking...";
    chat.appendChild(loadingMessage);

    try {
      const response = await fetch("/ai/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      loadingMessage.textContent =
        "AI: " + (data.answer || data.error);

    } catch (error) {
      loadingMessage.textContent =
        "AI: Sorry, something went wrong.";
    }
  });
</script>
</body>
</html>
